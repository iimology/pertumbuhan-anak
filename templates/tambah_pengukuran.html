{% extends "base.html" %}
{% block title %}Tambah Pengukuran{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-lg-7">
<div class="card shadow-sm">
<div class="card-body p-4">
<h1 class="h4">Tambah Pengukuran</h1>
<p class="text-muted">{{ child["name"] }} · Tanggal lahir {{ child["birth_date"] }}</p>

<form method="post">
    <div class="mb-3">
        <label class="form-label">Tanggal pengukuran *</label>
        <input type="date" name="measurement_date" value="{{ today }}" class="form-control" required>
        <div class="form-text">Usia dalam bulan dihitung otomatis dari tanggal lahir.</div>
    </div>

    <div class="mb-3">
        <label class="form-label">Tinggi badan (cm) *</label>
        <input type="number" name="height" class="form-control" step="0.1" min="0.1"
               value="{{ request.form.get('height', '') }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Berat badan (kg) *</label>
        <input type="number" name="weight" class="form-control" step="0.01" min="0.01"
               value="{{ request.form.get('weight', '') }}" required>
    </div>

    <div class="mb-4">
        <label class="form-label">Catatan</label>
        <textarea name="notes" class="form-control" rows="3">{{ request.form.get('notes', '') }}</textarea>
    </div>

    <a href="{{ url_for('detail_anak', child_id=child['id']) }}" class="btn btn-secondary">Batal</a>
    <button class="btn btn-primary">Simpan Pengukuran</button>
</form>
</div>
</div>
</div>
</div>
{% endblock %}
